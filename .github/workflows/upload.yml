# Both version branches publish to the single `latest` track:
#   main → latest/edge  (tracks Zig's master / nightly builds)
#   beta → latest/beta  (tracks the most recent stable Zig release)
# The risk level is derived from the branch name below.

name: Build and Upload SDK

on:
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    uses: canonical/sdkcraft-actions/.github/workflows/upload.yml@main
    with:
      platforms: '["amd64","arm64","riscv64"]'
      platform-flag: "--build-for"
      track: "latest"
      risk: ${{ github.ref_name == 'main' && 'edge' || 'beta' }}
      runs-on: '["ubuntu-latest"]'
    secrets:
      SDKCRAFT_STORE_CREDENTIALS: ${{ secrets.SDKCRAFT_STORE_CREDENTIALS_PROD }}
